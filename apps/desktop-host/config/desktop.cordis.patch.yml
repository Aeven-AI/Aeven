# Electron reuses the browser composition without its network and browser-launch rows.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

# Workspace file URLs are an HTTP route on the disabled webserver.
- id: workspace-files
  disabled: true

# Coding subscriptions sign in and report usage over same-origin routes on the
# disabled webserver, and the row injects `webServer` at plugin level, so it
# holds the whole tree pending here rather than degrading.
- id: llm-grok-build-oauth
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: directory-picker-native
      name: '@aeven/host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@aeven/client-ui-directory-picker-native'
