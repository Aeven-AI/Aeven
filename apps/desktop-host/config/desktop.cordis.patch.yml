# Electron and ordinary browsers share the authenticated loopback Host.

- id: identity-user-aeven
  config:
    apiUrl: !!js process.env.AEVEN_API_URL ?? 'https://aeven.io/api'
    xOAuthUrl: !!js process.env.AEVEN_OAUTH_X_URL ?? 'https://aeven.io/oauth/x'
    appleOAuthUrl: !!js process.env.AEVEN_OAUTH_APPLE_URL ?? 'https://aeven.io/oauth/apple'
    googleOAuthUrl: !!js process.env.AEVEN_OAUTH_GOOGLE_URL ?? 'https://aeven.io/oauth/google'
    oauthFlow: window
    webUrl: !!js process.env.AEVEN_WEB_URL ?? 'https://aeven.io'
    mediaUrl: !!js process.env.AEVEN_MEDIA_URL ?? 'https://aeven.io'

- id: llm-aeven
  config:
    apiUrl: !!js process.env.AEVEN_API_URL ?? 'https://aeven.io/api'

- id: web-search-deepseek
  config:
    apiKeyEnv: AEVEN_TOKEN
    model: Aeven-1.0-Flash

- id: media-aeven
  config:
    apiUrl: !!js process.env.AEVEN_API_URL ?? 'https://aeven.io/api'

- id: account-integrations
  config:
    apiUrl: !!js process.env.AEVEN_API_URL ?? 'https://aeven.io/api'
    slackClientId: !!js process.env.SLACK_CLIENT_ID
    slackCallbackPort: 12751

- id: web-startup
  disabled: true

- id: webserver
  inject: []
  config:
    host: 127.0.0.1
    port: 3080
    portInUse: os-assigned
    compression: none

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true


- id: connection
  inject:
    - credentials
  config: {}

- insert:
    # The disabled web-runtime row also carried the model's surface context;
    # replies here render in the same GUI, so the desktop mounts that part alone.
    - id: web-surface
      name: '@aeven/web-app/surface'

    - id: directory-picker-native
      name: '@aeven/host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@aeven/client-ui-directory-picker-native'

