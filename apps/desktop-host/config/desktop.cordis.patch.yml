# Electron and ordinary browsers share the authenticated loopback Host.

- id: identity-user-aeven
  config:
    apiUrl: !!js process.env.AEVEN_API_URL ?? 'https://aeven.io/api'
    xOAuthUrl: !!js process.env.AEVEN_OAUTH_X_URL ?? 'https://aeven.io/oauth/x'
    appleOAuthUrl: !!js process.env.AEVEN_OAUTH_APPLE_URL ?? 'https://aeven.io/oauth/apple'
    googleOAuthUrl: !!js process.env.AEVEN_OAUTH_GOOGLE_URL ?? 'https://aeven.io/oauth/google'
    oauthFlow: window
    webUrl: !!js process.env.AEVEN_WEB_URL ?? 'https://aeven.io'
    mediaUrl: !!js process.env.AEVEN_MEDIA_URL ?? 'https://aeven.io'
    jwksCacheFile: !!js avnHomePath('identity', 'aeven-jwks.json')

- id: llm-aeven
  config:
    apiUrl: !!js process.env.AEVEN_API_URL ?? 'https://aeven.io/api'

- id: web-search-deepseek
  config:
    apiKeyEnv: AEVEN_TOKEN
    model: Aeven-1.0-Flash

- id: media-aeven
  config:
    apiUrl: !!js process.env.AEVEN_API_URL ?? 'https://aeven.io/api'

- id: sync-yjs
  config:
    relayUrl: !!js process.env.AEVEN_SYNC_URL ?? 'wss://aeven.io/sync'

- id: api-sync-controller
  config:
    siteUrl: !!js process.env.AEVEN_WEB_URL ?? 'https://aeven.io'

- id: account-integrations
  config:
    apiUrl: !!js process.env.AEVEN_API_URL ?? 'https://aeven.io/api'
    slackClientId: !!js process.env.SLACK_CLIENT_ID
    slackCallbackPort: 12751

- id: web-startup
  disabled: true

- id: webserver
  inject: []
  config:
    host: 127.0.0.1
    port: 3080
    portInUse: os-assigned
    compression: none

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true


- id: connection
  inject:
    - credentials
  config: {}

- insert:
    # The disabled web-runtime row also carried the model's surface context;
    # replies here render in the same GUI, so the desktop mounts that part alone.
    - id: web-surface
      name: '@aeven/web-app/surface'

    - id: directory-picker-native
      name: '@aeven/host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@aeven/client-ui-directory-picker-native'

    # Workspace file sync: folder workspaces follow the account to its other
    # devices, peer to peer through the Syncthing executable the installed app
    # ships, or `pnpm dev:desktop` installs. Without AVN_SYNCTHING the rows stay
    # unmounted and workspaces sync without their files.
    - id: file-sync-syncthing
      name: '@aeven/file-sync-syncthing'
      disabled: !!js "process.env.AVN_SYNCTHING === undefined"
      config:
        binary: !!js "process.env.AVN_SYNCTHING ?? 'syncthing'"
        home: !!js avnHomePath('file-sync', 'syncthing')
        cloudUrl: !!js "`${process.env.AEVEN_API_URL ?? 'https://aeven.io/api'}/api/cloud/files`"
        # Aeven's own discovery and relay servers once they run; until then the public Syncthing pool.
        discoveryServers: !!js "process.env.AEVEN_SYNC_DISCOVERY?.split(',') ?? ['default']"
        listenAddresses: !!js "['default', ...(process.env.AEVEN_SYNC_RELAY?.split(',') ?? [])]"

    - id: workspace-file-sync
      name: '@aeven/workspace-file-sync'
      disabled: !!js "process.env.AVN_SYNCTHING === undefined"

    # Repository workspaces follow the account through Git: a checkout of the
    # same remote is reused, otherwise the repository is cloned, or copied from
    # another device through file sync when that is mounted.
    - id: workspace-git-sync
      name: '@aeven/workspace-git-sync'

    # Motion films: HyperFrames captures an HTML composition in Chromium and the
    # bundled ffmpeg encodes H.264 (VideoToolbox on macOS, Media Foundation on
    # Windows, VAAPI or OpenH264 on Linux). The renderer uses an installed
    # Chrome, Chromium, Edge, or Brave, else downloads a headless shell here.
    # The session-side `render_motion` tool and `motion` skill in the aeven
    # preset activate only while this service exists.
    - id: motion
      name: '@aeven/motion'

    - id: motion-hyperframes
      name: '@aeven/motion-hyperframes'
      config:
        browserCacheDir: !!js avnHomePath('motion', 'browser')

    # The Motion card's routes: the live preview bundle, the user's MP4
    # export, and the exported film's bytes.
    - id: api-motion
      name: '@aeven/api-motion'

