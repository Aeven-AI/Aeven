# Electron carries the browser composition over its custom protocol.

- id: web-startup
  disabled: true

- id: webserver
  inject: []
  config:
    host: 127.0.0.1
    port: 0
    compression: none

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

# Workspace file URLs are an HTTP route on the disabled webserver.
- id: workspace-files
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: directory-picker-native
      name: '@aeven/host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@aeven/client-ui-directory-picker-native'

