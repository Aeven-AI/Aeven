# Keyless counterpart to subagent-send-message/cordis.yml: replace the live adapter
# with replay and preserve its child and parent scheduling fence.
- id: llm-deepseek
  name: '@aeven/llm-deepseek'
  disabled: true

- id: agent-default-model
  name: '@aeven/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@aeven/session-persistence-jsonl'
  config:
    root: !!js avnHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@aeven/agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@aeven/system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: sandbox
  name: '@aeven/sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@aeven/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: send-message-fence
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-send-message-fence.ts'
