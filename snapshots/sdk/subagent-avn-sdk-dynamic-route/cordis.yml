# SDK-profile patch for a deterministic parent model that selects a route for
# a separate SDK child runtime. Both runtimes persist their request headers.

- id: llm-deepseek
  name: '@aeven/llm-deepseek'
  disabled: true

- id: tool-subagent
  name: '@aeven/tool-subagent'
  disabled: true

- id: sdk-jsonrpc-server
  name: '@aeven/sdk-jsonrpc-server'
  disabled: true

- id: session-persistence-jsonl
  name: '@aeven/session-persistence-jsonl'
  config:
    root: !!js avnHomePath('sessions')
    compression: none

- insert:
    - id: mock-llm
      name: '../../../packages/subagent/subagent-avn-sdk/tests/fixtures/loader/mock-delegating-llm.ts'
      disabled: !!js process.env.AVN_SNAPSHOT !== 'record'

    - id: subagent-avn-sdk
      name: '@aeven/subagent-avn-sdk'
      config:
        profile: sdk
        patches: !!js JSON.parse(process.env.AVN_TEST_CHILD_PATCHES ?? '[]')
        avnHome: !!js process.env.AVN_TEST_CHILD_HOME
        provider: mock
        model: mock-routed
        env:
          AVN_TELEMETRY_DISABLED: '1'

    - id: subagent-model-selection-settings
      name: '@aeven/tool-subagent/model-selection-settings'
      config:
        enabled: true
        allowedModels:
          - provider: mock
            model: mock-routed

    - id: tool-subagent-avn-sdk
      name: '../../../packages/subagent/subagent-avn-sdk/tests/fixtures/loader/scoped-tool-subagent.ts'
      config:
        provider: avn-sdk
        toolName: subagent
        enableRunInBackground: false
        agentOptions:
          maxTokens: 777
        maxDepth: 'provider-managed'

    - id: sdk-jsonrpc-server-dynamic-live
      name: '@aeven/sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      disabled: !!js process.env.AVN_SNAPSHOT !== 'record'
      config:
        maxTokensAsSuccess: true
