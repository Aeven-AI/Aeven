# Minimal live counterpart for the persistent-pwsh-tool-turn snapshot composition.
- id: llm-deepseek
  name: '@aeven/llm-deepseek'
  config:
    models:
      - id: deepseek-v4-pro

- id: sandbox-policy
  name: '@aeven/sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@aeven/subprocess-local'

- insert:
    - id: terminal
      name: '@aeven/terminal'

- insert:
    - id: terminal-pwsh
      name: '@aeven/terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 30000

- id: agent-default-model
  name: '@aeven/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@aeven/session-persistence-jsonl'
  config:
    root: !!js avnHomePath('sessions')
    compression: !!js 'process.env.AVN_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@aeven/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@aeven/system-prompt'
  config:
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@aeven/tool-jobs'
  disabled: true

- id: goal
  name: '@aeven/goal'
  disabled: true

- id: goal-round-driver
  name: '@aeven/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@aeven/command-goal'
  disabled: true

- id: tool-goal
  name: '@aeven/tool-goal'
  disabled: true

- id: skill
  name: '@aeven/skill'
  disabled: true

- id: skill-filesystem
  name: '@aeven/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@aeven/tool-skill'
  disabled: true

- id: tool-bash
  name: '@aeven/tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@aeven/tool-pwsh-persistent'
