# Private Python PTC composition: replace the headless worker provider through
# the real Loader and render the generated Python SDK prompt.
- id: agent-default-model
  name: '@aeven/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@aeven/session-persistence-jsonl'
  config:
    root: !!js avnHomePath('sessions')
    compression: !!js 'process.env.AVN_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@aeven/agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@aeven/tools'
  config:
    mode: ptc

- id: code-runtime
  disabled: true

- insert:
    - id: code-runtime-python
      name: '@aeven/experimental-code-runtime-python'

- id: system-prompt
  name: '@aeven/system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.
