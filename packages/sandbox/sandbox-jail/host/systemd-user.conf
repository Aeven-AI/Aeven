# /etc/systemd/system/aeven-hosted.service.d/user.conf: the Host serves many
# accounts, so it runs as a user without sudo rights beyond the quota helper; a
# compromised Host process is not root. Create the user with
#   useradd --system --user-group --home-dir /var/lib/aeven-hosted --create-home \
#     --shell /usr/sbin/nologin aeven-hosted
# and give it the Host's home, logs, compile cache, and accounts filesystem.
#
# AVN_HOME holds every conversation, attachment, account folder, and share
# total, and defaults to ~/.aeven, so changing the unit's user moves it. Point
# it at the Aeven home the Host used before (for a Host that ran as ubuntu,
# /home/ubuntu/.aeven, moved out of the 0750 home), chown that tree to
# aeven-hosted, and keep /etc/aeven-sandbox/accounts-root naming its
# sandbox/accounts folder on the filesystem mounted with prjquota.
[Service]
User=aeven-hosted
Group=aeven-hosted
Environment=HOME=/var/lib/aeven-hosted
Environment=AVN_HOME=/var/lib/aeven-hosted/.aeven
