# /etc/systemd/system/aeven-hosted.service.d/sandbox.conf: systemd starts the
# Host in <unit>/host and lets it create <unit>/jail/acct-<account> beside it.
[Service]
Delegate=yes
DelegateSubgroup=host
Environment=AVN_HOSTED_SANDBOX=1

# With commandUser, the Host starts only once both mounts of the quota-limited
# accounts filesystem are present, so commands never write to the disk beneath.
[Unit]
RequiresMountsFor=/datadrive/apps/aeven-hosted/home/sandbox/accounts /srv/aeven-accounts
