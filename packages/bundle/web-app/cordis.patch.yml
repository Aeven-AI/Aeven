# The avn-web-app bundle patch: the browser surface over the avn-base layer.
# Applied after avn-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The web-startup plugin injects `cmdlineArgs` and provides `webStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The web runtime then
# provides bind-dependent `webRuntime` values to the trust fence.
# `avn --profile web --help` provides neither service, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# Full-text session search is available by default but stays lazy. This
# restatement keeps the Web values on one ephemeral in-memory index and defers
# the node:sqlite import and handle until the first content search.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

# Web search runs through the Aeven gateway's Messages route, which forwards to
# DeepSeek's search and bills the signed-in reader, so no DeepSeek key is held
# here. The credential is the Aeven session the client hands to the Host, the
# same one `llm-aeven` presents.
- id: web-search-deepseek
  config:
    apiKeyEnv: AEVEN_TOKEN
    baseURL: !!js (process.env.AEVEN_API_URL ?? 'http://localhost:9000') + '/v1'
    model: Aeven-1.0-Flash

- id: tools
  config:
    # TEMPORARY workaround: AVN_TOOLS_MODE (native|ptc|both) opts a whole avn
    # process into PTC mode while per-session tool-presentation selection is being
    # designed; unset keeps the schema default (native). Remove the env seam
    # once the web UI owns the choice per session.
    mode: !!js process.env.AVN_TOOLS_MODE

# ── web-only host rows, the transport layer, and the browser roster ─────────

# `avn.client` rows are the browser roster the modules node half scans into
# window.__AVN_BOOT__; the modules row is simultaneously a host row.
- insert:
    # Host-owned opt-in sampled when a new Web session receives its preset
    # delegation tools. The Plugins page edits this settings namespace.
    - id: subagent-model-selection-settings
      name: '@aeven/tool-subagent/model-selection-settings'

    - id: code-runtime
      name: '@aeven/code-runtime-worker-thread'

    - id: message-feedback
      name: '@aeven/message-feedback'
      config:
        maxNoteBytes: 8192

    - id: workspace
      name: '@aeven/workspace'

    # Read-only HTTP view of a registered workspace's files, so a file the
    # agent produced can be referenced from a rendered reply (a markdown image
    # or a link). Authenticated by Connection on every request; the whole
    # workspace directory is readable to a holder of a browser session, so a
    # deployment that must not expose workspace contents over HTTP removes
    # this row and the surface prompt's workspace-URL sentence with it.
    - id: workspace-files
      name: '@aeven/host-workspace-files'
      config:
        mount: /workspace

    - id: session-reference
      name: '@aeven/session-reference'

    - id: file-reference-local
      name: '@aeven/file-reference-local'

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@aeven/session-stats'

    # Whole-log turn outline for the chat turn rail (the turnOutline
    # projection key): every turn stays navigable before its events page in.
    - id: session-turn-outline
      name: '@aeven/session-turn-outline'

    # Resolve bind host, SSH launch, and display once at boot, then mount the
    # matching dual-face directory picker. Mount -native or -browse directly in
    # an overlay to pin the interaction.
    - id: directory-picker
      name: '@aeven/host-directory-picker-auto'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@aeven/host-plugin-inventory'

    # ── the authenticated reader ────────────────────────────────────────────────

    # The seam every authority registers into. Mounted before the authority so
    # the registry exists when it registers.
    - id: identity-user
      name: '@aeven/identity-user'

    # Aeven owns the credential this application authenticates against. With an
    # authority mounted the request fence demands a session instead of the
    # launch token, so a deployment that does not operate an Aeven API must
    # disable this row and `ui-account-aeven` together.
    #
    # The two secrets are the Aeven API's own JWT_SECRET and REFRESH_SECRET;
    # verification is local, so identifying a caller costs no request. AVN must
    # be served from the same site as the API: a WebSocket upgrade carries no
    # header and authenticates by cookie alone, and `localhost` and `127.0.0.1`
    # are different sites to a browser.
    - id: identity-user-aeven
      name: '@aeven/identity-user-aeven'
      inject: [identityUsers]
      config:
        apiUrl: !!js process.env.AEVEN_API_URL ?? 'http://localhost:9000'
        accessSecretEnv: AEVEN_JWT_SECRET
        refreshSecretEnv: AEVEN_REFRESH_SECRET
        xOAuthUrl: !!js process.env.AEVEN_OAUTH_X_URL
        appleOAuthUrl: !!js process.env.AEVEN_OAUTH_APPLE_URL
        googleOAuthUrl: !!js process.env.AEVEN_OAUTH_GOOGLE_URL
        # This bundle serves a public page, so a provider sign-in may take the
        # reader's document to the provider and back. A deployment that serves
        # its own page from a scheme or a loopback origin states `window`
        # instead: there, a redirected document is a second shell to boot.
        oauthFlow: !!js process.env.AEVEN_OAUTH_FLOW ?? 'redirect'
        webUrl: !!js process.env.AEVEN_WEB_URL
        mediaUrl: !!js process.env.AEVEN_MEDIA_URL ?? 'http://localhost:9020'

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@aeven/api-session-controller'

    # Browser observation and human control of background jobs.
    - id: job-controller
      name: '@aeven/api-job-controller'

    # Dictation: the recognizer registry, the local Whisper provider, and the
    # browser's `speech` Remote. The provider checks its cache on activation and
    # downloads its model only when the reader prepares it in Settings.
    - id: speech-to-text
      name: '@aeven/speech-to-text'
      config:
        defaultProvider: whisper-local

    - id: speech-to-text-whisper
      name: '@aeven/speech-to-text-whisper'
      config:
        dataRoot: !!js avnHomePath('speech-to-text', 'whisper')

    - id: api-speech-to-text
      name: '@aeven/api-speech-to-text'

    # Long-term memory: the `memory` slot and the MemOS provider, which runs the
    # MemOS core in this process and routes its auxiliary model calls through
    # the owning session's `llm` route. The slot always mounts because the
    # presets' `memory-context` and `tool-memory` rows inject it; they add
    # prompt text and tools only while a provider is registered. The provider is
    # on by default, so a fresh install remembers from its first session. Its
    # Viewer stays off: it serves every account's stored memory with no sign-in,
    # while this Host serves several accounts, each reaching only its own memory
    # through the memory manager.
    - id: memory
      name: '@aeven/memory'

    - id: memory-memos
      name: '@aeven/memory-memos'
      config:
        home: !!js avnHomePath('memory')
        viewer: false

    # Learned capabilities: per-user procedures the agent learned, stored as
    # agentskills directories and published through the skill catalog once the
    # user confirms them. Independent of the memory provider.
    - id: capability
      name: '@aeven/capability'
      config:
        root: !!js avnHomePath('capabilities')

    # Settings → Memory: the signed-in user's memories and learned
    # capabilities, with View, Correct, and Forget.
    - id: api-memory-manager
      name: '@aeven/api-memory-manager'

    # File attachments: the reader registry and the built-in JavaScript
    # readers (PDF, Office Open XML, OpenDocument, Pages, Keynote, Numbers,
    # RTF, EPUB, HTML, text). The office reader runs the bundled LibreOffice
    # engine for legacy Word, Excel, and PowerPoint files and as the fallback
    # for Office files.
    - id: document-extract
      name: '@aeven/document-extract'

    - id: document-extract-js
      name: '@aeven/document-extract-js'

    - id: document-extract-office
      name: '@aeven/document-extract-office'

    - id: document-extract-ocr
      name: '@aeven/document-extract-ocr'

    # Workspace listings, text previews and name search for the right
    # sidebar's file explorer.
    - id: api-workspace-files
      name: '@aeven/api-workspace-files'

    # Interactive shells the right sidebar's terminal pills attach to.
    - id: terminal-controller
      name: '@aeven/api-terminal-controller'

    # iOS Simulators and Android Emulators for the right sidebar's device
    # pane: sessions, consent, and the authenticated hub proxy. Nothing
    # installs or starts until the reader enables device support in the pane.
    - id: device
      name: '@aeven/device'

    # This machine as a device host: expo-device-hub and agent-device.
    - id: device-local
      name: '@aeven/device-local'

    # One visible Chrome on 9333 (not the desktop renderer's 9222), shared by
    # the sidebar and chrome-devtools-mcp. Playwright starts its own browser
    # on first use, so boot does not wait on that CDP attach. A missing Chrome
    # logs and leaves the host up. Both servers' tools stay behind tool_search.
    - id: browser-chromium
      name: '@aeven/browser-chromium'
      config:
        port: 9333
        launchOnStart: true
        mcpServerName: chrome_devtools
    - id: mcp-chrome-devtools
      name: '@aeven/mcp-client'
      config:
        transport: stdio
        serverName: chrome_devtools
        command: !!js "process.platform === 'win32' ? 'npx.cmd' : 'npx'"
        args:
          - '-y'
          - chrome-devtools-mcp@latest
          - '--browser-url=http://127.0.0.1:9333'
          - '--no-usage-statistics'
        failOnStartupError: false
    - id: mcp-playwright
      name: '@aeven/mcp-client'
      config:
        transport: stdio
        serverName: playwright
        command: !!js "process.platform === 'win32' ? 'npx.cmd' : 'npx'"
        args:
          - '-y'
          - '@playwright/mcp@latest'
          - '--caps=devtools'
        failOnStartupError: false

    # Configuration-surface reads and writes over Typert Remote. Each method
    # reports an actionable error when its settings-domain provider is absent.
    - id: settings-controller
      name: '@aeven/api-settings-controller'

    # Workspace commands and reconnect-safe projection over Typert Remote.
    - id: workspace-controller
      name: '@aeven/api-workspace-controller'

    - id: cordis-host-runner
      name: '@aeven/cordis-host-runner'

    # Ordinary provider for the parsed Web flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: web-startup
      name: '@aeven/web-app/startup'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    # Plain route-registration carrier; host and port come from the app's
    # webStartup provider, with these deployment fallbacks. The dist is served by
    # the web-runtime row below through the fallback seat.
    - id: webserver
      name: '@aeven/host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # Web glue owned by this bundle: resolves the built frontend dist (an
    # assembly fact of avn-web-app, never user config), mounts the
    # frontend-static fallback owner, registers the web-surface prompt
    # section and the bash runtime variable, prints the URL line, and opens the
    # canonical local URL after the full tree settles. The webStartup provider
    # supplies invocation-only values; after the server binds, this row samples
    # LAN trust once and provides `webRuntime`. A complete agent-preset persona
    # suppresses the prompt section for that agent while retaining the host-owned
    # shell variable.
    - id: web-runtime
      name: '@aeven/web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    # The client-plugin reload chain, always mounted: it is idle until a
    # rebuild watcher (pnpm run dev:web) actually rewrites client bundles. It
    # is a row rather than a child of web-runtime because its node half is a
    # client-side package, which a host-side bundle cannot import.
    - id: client-hmr
      name: '@aeven/client-hmr'

    # ── browser plugin roster (avn.client rows; node halves are layer-2 hosts) ──

    # Dual-face: the node half scans this tree, composes window.__AVN_BOOT__,
    # and serves /plugins/<id>/client.js; the browser half is the module table
    # the shell kernel constructs before cordis exists (adopted as a plugin
    # entry by the kernel, never fetched).
    - id: modules
      name: '@aeven/client-modules'

    # Owns both ends of the web transport: node half binds the gateway to the
    # webserver under /api; browser half is the fetch/SSE client.
    - id: connection
      name: '@aeven/client-connection'
      inject: [webRuntime]
      config:
        # LAN literals derived from the active bind plus --trusted-host extras.
        # A deployment adding authorities keeps this expression and concatenates
        # its literals, for example: ['app.internal', ...ctx.webRuntime.trustedHosts].
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    - id: api-remotes
      name: '@aeven/api-remotes'

    - id: cordis-client-runner
      name: '@aeven/cordis-client-runner'

    - id: ui-theme
      name: '@aeven/client-ui-theme'

    - id: locale
      name: '@aeven/client-locale'

    - id: ui-layout
      name: '@aeven/client-ui-layout'

    - id: ui-renderer
      name: '@aeven/client-ui-renderer'

    - id: ui-session
      name: '@aeven/client-ui-session'

    - id: ui-sidebar
      name: '@aeven/client-ui-sidebar'

    - id: ui-sidebar-right
      name: '@aeven/client-ui-sidebar-right'

    - id: ui-sidebar-select
      name: '@aeven/client-ui-sidebar-select'

    - id: ui-sidebar-browser
      name: '@aeven/client-ui-sidebar-browser'

    - id: ui-sidebar-files
      name: '@aeven/client-ui-sidebar-files'

    - id: ui-sidebar-terminal
      name: '@aeven/client-ui-sidebar-terminal'

    - id: ui-sidebar-device
      name: '@aeven/client-ui-sidebar-device'

    - id: ui-settings
      name: '@aeven/client-ui-settings'

    - id: ui-settings-general
      name: '@aeven/client-ui-settings-general'

    - id: ui-settings-models
      name: '@aeven/client-ui-settings-models'

    - id: ui-settings-plugin-inventory
      name: '@aeven/client-ui-settings-plugin-inventory'

    # Settings → Memory, over the memoryManager Remote.
    - id: ui-settings-memory
      name: '@aeven/client-ui-settings-memory'

    - id: ui-conversation
      name: '@aeven/client-ui-conversation'

    - id: ui-approval
      name: '@aeven/client-ui-approval'

    # Asks the reader for their location when the model calls get_location.
    - id: ui-location
      name: '@aeven/client-ui-location'

    - id: ui-chat
      name: '@aeven/client-ui-chat'

    # Imagine: the /i/<id> page that takes the center column in place of the chat.
    - id: ui-imagine
      name: '@aeven/client-ui-imagine'

    # Official occupants for the generic sidebar and conversation brand slots.
    - id: ui-brand-official
      name: '@aeven/client-ui-brand-official'

    - id: ui-attachment
      name: '@aeven/client-ui-attachment'

    # Tool call tree, generic fallback, and keyed business Tool views.
    - id: ui-tool
      name: '@aeven/client-ui-tool'

    - id: ui-cordis
      name: '@aeven/client-ui-cordis'

    # Durable workflow lifecycle as an independent Chat node after the
    # existing generic workflow tool row.
    - id: ui-workflow-run
      name: '@aeven/client-ui-workflow-run'

    # Turn tail: the produced-files row under each closing assistant message.
    # Remove this entry to turn the surface off; the tail hole renders empty.
    - id: ui-deliverables
      name: '@aeven/client-ui-deliverables'


    - id: ui-workspace
      name: '@aeven/client-ui-workspace'

    # Input triggers: the '/' | '@' pipeline (ui-input-trigger), the command surface over
    # it (ui-commands), and the reference sources (ui-skill / ui-reference).
    - id: ui-input-trigger
      name: '@aeven/client-ui-input-trigger'

    - id: ui-commands
      name: '@aeven/client-ui-commands'

    - id: ui-skill
      name: '@aeven/client-ui-skill'

    - id: ui-subagent
      name: '@aeven/client-ui-subagent'

    - id: ui-reference
      name: '@aeven/client-ui-reference'

    # The signed-in Aeven reader's avatar and account menu, showing whoever the
    # `identity-user-aeven` authority above restored. A deployment that
    # disables that authority disables this row with it: without a reader there
    # is nothing for the menu to show.
    - id: ui-account-aeven
      name: '@aeven/client-ui-account-aeven'

    # Background jobs: the session-header list. The client half of
    # `@aeven/api-job-controller` (the host row above) provides `ctx.jobs`.
    - id: ui-jobs
      name: '@aeven/client-ui-jobs'

    # Dictation: the composer mic and recorder pill, and Settings → Voice. The
    # host half is the `speech-to-text` rows above; audio stays on this Host.
    - id: ui-voice-input
      name: '@aeven/client-ui-voice-input'

    # Goal surface: GoalBar in the input dock over the goal session projection.
    - id: ui-goal
      name: '@aeven/client-ui-goal'

    # Per-message feedback: Like/Dislike plus an optional note in the
    # assistant-message action strip, over the messageFeedback Remote.
    - id: ui-message-feedback
      name: '@aeven/client-ui-message-feedback'

    # Model selection: the /model popupSelect + composer seat over session.models.
    - id: ui-model-selection
      name: '@aeven/client-ui-model-selection'

    - id: ui-permission
      name: '@aeven/client-ui-permission-presets'

    # The agent-preset row in General settings: the default preset for
    # sessions created later. Absent a roster it renders nothing.
    - id: ui-agent-preset
      name: '@aeven/client-ui-agent-preset'

    # Plugin configuration: the host-plane sections a user owns, as expandable
    # cards. A namespace this deployment does not expose renders nothing.
    - id: ui-settings-plugins
      name: '@aeven/client-ui-settings-plugins'

    # Plan control: the composer plan seat over the plan projection + /plan channel.
    - id: ui-plan
      name: '@aeven/client-ui-plan'

    - id: ui-user-questions
      name: '@aeven/client-ui-user-questions'

    - id: ui-trajectory
      name: '@aeven/client-ui-trajectory'

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools, its prompt sections, its delegation backends. The base keeps them
# for the TUI, which is single-session and composes its agent process-wide; the
# Web surface disables them here and lets each session mount a preset instead.
#
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear the day someone reorders
# the composition.

# `shell-env` STAYS in the host plane: `apps/cli/src/web.ts` injects it to
# publish `AVN_WEB_URL`/`AVN_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# would never reach the model's shell at all.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# The background-job REGISTRY stays on the host plane; only the model-facing
# `job_*` controls move. Its producers — `tool-bash` here, `tool-terminal` and a
# non-continuable `tool-subagent` elsewhere — are preset rows that resolve it
# with `ctx.get`, and an entry-local realm around the registry is invisible to
# every sibling row outside that realm, so `run_in_background` answered
# "background jobs unavailable" while the controls sat in the catalog. That is
# the `goals` criterion read from inside the preset: a Service a row outside its
# realm READS belongs to the plane both can see. The registry is keyed by owning
# agent, so one host instance serves every session exactly as before presets.

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

# The `skill` REGISTRY stays in the host plane. It is host+per-scope layered
# (the tools-registry shape): deployment-level providers — repository plugins,
# a host skill-filesystem row — register into its global layer, while a preset's
# `skill-filesystem` registers into that preset's layer, and each agent reads the
# merged catalog its scope chain selects. Only the per-agent rows move behind
# presets: the base host `skill-filesystem` row is disabled here (presets own local
# discovery), and `tool-skill` is what a preset mounts to give its agent the
# catalog and loader at all.

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

# The goal service and session driver stay on the host plane, where Gateway
# remotes resolve them. Presets own the human command and model-facing tool.

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

# The token METER stays on the host plane; only the compaction backend that
# reads it moves. It owns the context-meter projection units, and that table is
# process-wide, so preset ownership would make the meter a function of which
# presets happen to be mounted rather than a per-session fact. Same criterion as
# `tasks` and `goals`; the reasoning has one home in
# `.agents/notes/implemented/architecture/2026-08-10-host-plane-ownership-after-presets.md`.

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# The subagent registry and its backends STAY in the host plane. `subagents` is
# a process singleton with a cross-session query surface (`listChildren`,
# `followup`) that the host api-proxy serves to the browser, and a provider
# registers under a globally unique name, so a per-session copy would both
# starve that host row and collide on the second session. What a preset
# chooses is which delegation TOOLS its agent sees, below.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# Image generation. The seam and its providers stay in the host composition;
# only the model-facing tool is per-session, and it lives in the agent preset
# beside the other tools. Each provider package contributes one provider and
# resolves its own credential, so adding a second is one more row here and no
# consumer change.
- insert:
    - id: media
      name: '@aeven/media'
      config:
        # Two registered image providers make selection ambiguous, which the
        # seam reports rather than guessing; this names the default. A call
        # naming its own `provider` still outranks it.
        imageProvider: deepinfra
    - id: media-deepinfra
      name: '@aeven/media-deepinfra'
    - id: media-openrouter
      name: '@aeven/media-openrouter'

# The preset roster. The shipped presets are bundled inside
# `avn-agent-presets` itself and prepended as a read-only `system` root
# (`includeShippedRoot`); `$AVN_HOME/.agent-presets` is where a person — or an
# agent — authors their own, appended by the same package (`includeUserRoot`),
# and carries the same trust as shell access because a preset IS a
# composition. This row only names the default and any deployment-added
# `roots`; no launcher patching is involved.
#
# The default is the shipped `aeven` composition, the one every session runs;
# the other presets are chosen only from Developer mode. A user's own
# `agent-presets.default` still outranks this value, as does the Developer-mode
# picker.
- insert:
    - id: agent-presets
      name: '@aeven/agent-presets'
      config:
        default: aeven
