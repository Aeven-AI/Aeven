# The avn-hosted-app bundle patch: Aeven Web as Aeven operates it, one Host
# serving the accounts of many people. Applied after avn-web-app, so every row
# below targets a web or base row by id; a patch replaces the targeted row's
# whole `config`, so each row restates every key it owns.
#
# Two rules decide every row here:
#
# - Nothing runs on the Host's own machine for a session outside a per-account
#   jail: no file tool, no terminal, no browser, no device, no desktop control.
#   The Host's disk and processes belong to every account at once, so any of
#   these would reach the other accounts' data. With AVN_HOSTED_SANDBOX=1 the
#   bash tool runs each command in its account's jail (see "commands in a
#   per-account jail" below); without it, there is no shell either.
# - Nothing one account changes applies to another. The settings document and
#   the credential store belong to the Host, so browser callers cannot write
#   them, and account settings are not mirrored into them.
#
# Per-account state that already keys by the signed-in user stays: sessions,
# workspaces, memory, personalization, automations, connectors, mail, sync.

# ── binding behind the public origin ────────────────────────────────────────

# The Host listens on the address the deployment names (a container binds every
# interface; a reverse proxy on the same machine keeps loopback) and never opens
# a browser. TLS, the public name, and request limits belong to the proxy.
- id: webserver
  inject: [webStartup]
  config:
    host: !!js process.env.AVN_HOSTED_HOST ?? ctx.webStartup.host ?? '127.0.0.1'
    port: !!js "Number(process.env.AVN_HOSTED_PORT ?? ctx.webStartup.port ?? 3085)"
    portInUse: fail
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: web-runtime
  inject: [webStartup]
  config:
    openBrowser: false
    printUrl: true
    surfaceContext: true
    developerContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# The public names browsers reach this Host by, such as `app.aeven.io`, comma
# separated in AVN_HOSTED_TRUSTED_HOSTS. The request fence refuses any other
# Host or Origin header.
- id: connection
  inject: [webRuntime]
  config:
    trustedHosts: !!js "[...ctx.webRuntime.trustedHosts, ...(process.env.AVN_HOSTED_TRUSTED_HOSTS?.split(',').map(host => host.trim()).filter(host => host !== '') ?? [])]"

# Development reload has no place on a shared Host.
- id: client-hmr
  disabled: true

# Aeven operates this Host, so its sign-in screens offer the production
# provider sign-ins unless the deployment names others. A provider sign-in
# leaves this page for the provider and returns to this origin's
# `/oauth-result`, which the Aeven API must list in OAUTH_CLIENT_ORIGINS.
- id: identity-user-aeven
  inject: [identityUsers]
  config:
    apiUrl: !!js process.env.AEVEN_API_URL ?? 'https://aeven.io/api'
    xOAuthUrl: !!js process.env.AEVEN_OAUTH_X_URL ?? 'https://aeven.io/oauth/x'
    appleOAuthUrl: !!js process.env.AEVEN_OAUTH_APPLE_URL ?? 'https://aeven.io/oauth/apple'
    googleOAuthUrl: !!js process.env.AEVEN_OAUTH_GOOGLE_URL ?? 'https://aeven.io/oauth/google'
    oauthFlow: redirect
    webUrl: !!js process.env.AEVEN_WEB_URL ?? 'https://aeven.io'
    mediaUrl: !!js process.env.AEVEN_MEDIA_URL ?? 'https://aeven.io'
    helpCenterUrl: !!js process.env.AEVEN_HELP_CENTER_URL ?? 'https://helpcenter.aeven.io'
    jwksCacheFile: !!js avnHomePath('identity', 'aeven-jwks.json')

# ── account sync ────────────────────────────────────────────────────────────

# A hosted Host is one more device of every account signed in to it: each
# account's conversations, workspaces and memory arrive through Aeven's relay
# and stay in that account's own sync database. Aeven operates this Host, so it
# reaches the production relay and passkey page unless the deployment names
# others.
#
# The Host stays connected for every account that has signed in here, through
# the sync grant the relay issues on the first signed-in connection, so an
# account is current before its browser opens. Its memory is built as soon as
# it syncs rather than at its first turn.
- id: sync-yjs
  config:
    relayUrl: !!js process.env.AEVEN_SYNC_URL ?? 'wss://aeven.io/sync'
    # The account's other devices list this Host by this name, not its machine host name.
    deviceName: Aeven Cloud
    keepConnected: true
    # A browser opens on the conversation and workspace lists; the long tail of each account arrives after them.
    firstDocuments: [devices, workspaces, sessions/index, sessions/live, settings/account, personalization, automations]

- id: memory-memos
  config:
    home: !!js avnHomePath('memory')
    accounts: !!js avnHomePath('accounts')
    openOnSync: true
    workspaceIdentity: true
    embeddingExecution: worker
    embeddingQueuePerAccount: 8
    embeddingQueueTotal: 128

- id: api-sync-controller
  config:
    siteUrl: !!js process.env.AEVEN_WEB_URL ?? 'https://aeven.io'

# ── nothing one account changes applies to another ──────────────────────────

# Each person's own settings (language, default model, chat preferences) live
# in that account's section beside its other data, so one account's choice
# never applies to another; account sync carries them to the person's other
# devices. The Host's own document and its credentials are read-only to
# browser callers.
- id: settings
  config:
    accounts: true

- id: credentials
  config:
    accounts: true

- id: settings-controller
  config:
    writable: false

# Coding subscriptions (Grok Build, ChatGPT Codex) are each account's own: an
# account signs in to its subscriptions from the Providers page, its
# credentials and model choices live in its own directory, and its model
# routes serve only its sessions.
- id: llm-grok-build-oauth
  config:
    accounts: true

# The media providers read keys from the Host's credential store, which would
# bill every account to whoever stored the key.
- id: media-deepinfra
  disabled: true

- id: media-openrouter
  disabled: true

# The Loader inventory and the runner that mounts plugins change or describe the
# whole Host.
- id: plugin-inventory
  disabled: true

- id: cordis-host-runner
  disabled: true

# The browser halves of that runner, which have nothing on this Host to talk to.
- id: cordis-client-runner
  disabled: true

- id: ui-cordis
  disabled: true


# ── no Workspace directories on the Host ────────────────────────────────────

# Read-aloud for everyone on this Host leaves from one address, and the Edge
# service refuses bursts of handshakes from one address with 429; the voices
# are the web bundle's own (a patch replaces the whole row config).
- id: text-to-speech-edge
  config:
    throttleRetries: 4
    throttleRetryMs: 400
    voices:
      - id: en-US-AvaMultilingualNeural
        name: Ava
        language: en
      - id: nl-NL-FennaNeural
        name: Fenna
        language: nl
      - id: es-CO-SalomeNeural
        name: Salome
        language: es
      - id: zh-CN-XiaoxiaoNeural
        name: Xiaoxiao
        language: zh
      - id: de-DE-SeraphinaMultilingualNeural
        name: Seraphina
        language: de

# A workspace a desktop made without a folder continues here as the account's own.
- id: workspace
  config:
    pathlessWorkspaces: true

# Workspaces are created by name and carry no folder: a folder of this Host
# would expose the Host's files to whoever registered it.
- id: workspace-controller
  config:
    folders: false

# A conversation another device recorded in a folder continues here as a
# conversation without a working directory once that device stops running it,
# instead of waiting for a folder this Host never offers. While the device is
# online and runs the conversation, input still reaches it there.
- id: working-directory
  config:
    folders: false
    # With the jail, each account's sessions work in a folder this Host creates
    # for that account, which is the only folder its commands can see.
    managedRoot: !!js "process.env.AVN_HOSTED_SANDBOX === '1' ? avnHomePath('sandbox', 'accounts') : undefined"

- id: directory-picker
  disabled: true

- insert:
    - id: ui-workspace-name
      name: '@aeven/client-ui-workspace-name'

# Directory reads that only a folder workspace or a local file reference serve.
# The HTTP route serves any registered workspace to any signed-in browser.
- id: workspace-files
  disabled: true

# With the jail, the Files sidebar shows the account folder a session works
# in: listings, previews and searches all stay inside it, and the Remote
# answers only for the caller's own sessions.
# Every file read verifies that the opened file is the one resolved, so a
# jailed command swapping a path component for a symlink between the check and
# the read cannot redirect a read the Host makes for its readers.
- id: fs-sandbox
  config:
    verifyReads: !!js process.platform === 'linux'

- id: api-workspace-files
  disabled: !!js process.env.AVN_HOSTED_SANDBOX !== '1'
  config:
    confineReads: true

- id: file-reference-local
  disabled: true

- id: ui-sidebar-files
  disabled: !!js process.env.AVN_HOSTED_SANDBOX !== '1'

# The produced-files row under a reply opens files in the Files sidebar; only
# jailed commands produce files on this Host.
- id: ui-deliverables
  disabled: !!js process.env.AVN_HOSTED_SANDBOX !== '1'

# ── nothing runs on the Host's machine ──────────────────────────────────────

# What needs the reader's own computer keeps its place in the interface and
# opens the "Available in Aeven Desktop" dialog: the right sidebar's Files,
# Browser, Terminal and Devices entries, and a conversation whose folder is on
# a device that is not running it.
- insert:
    - id: ui-desktop-handoff
      name: '@aeven/client-ui-desktop-handoff'

# Pages that configure the Host itself, which a person using Aeven on the web
# neither sees nor changes: plugin settings, model provider keys and
# subscriptions, and tool permission presets.
- id: ui-settings-plugins
  disabled: true

- id: ui-settings-models
  disabled: false

- id: ui-permission
  disabled: true

- id: terminal-controller
  disabled: true

- id: ui-sidebar-terminal
  disabled: true

- id: browser-chromium
  disabled: true

- id: mcp-chrome-devtools
  disabled: true

- id: mcp-playwright
  disabled: true

- id: ui-sidebar-browser
  disabled: true

- id: device
  disabled: true

- id: device-local
  disabled: true

- id: ui-sidebar-device
  disabled: true

- id: tool-elevation
  disabled: true

- id: computer-use
  disabled: true

- id: computer-use-cua-driver
  disabled: true

- id: computer-use-semantic-batches
  disabled: true

- id: computer-use-windows-batches
  disabled: true

# Process-wide tools the base mounts that act on the Host's directories and Git.
- id: tool-working-directory
  disabled: true

- id: tool-worktrees
  disabled: true

- id: vcs
  disabled: true

- id: vcs-git
  disabled: true

- id: tool-vcs
  disabled: true

- id: tool-agent-team
  disabled: true

# The model has no edit or write tool here and changes files with jailed
# commands, so a guard that sends in-place edits to those tools is off.
- id: bash-edit-guard
  disabled: true

# Dictation goes to the Aeven API with the speaker's own session instead of a
# local Whisper worker, which would hold a model in this process for everyone.
- id: speech-to-text
  config:
    defaultProvider: aeven-cloud

- id: speech-to-text-whisper
  disabled: true

- insert:
    - id: speech-to-text-aeven
      name: '@aeven/speech-to-text-aeven'
      config:
        apiUrl: !!js process.env.AEVEN_API_URL ?? 'https://aeven.io/api'

# Every session runs the `aeven` composition without the rows that act on the
# Host's machine. Skills come only from the ones the composition ships, never
# from the Host user's own skill directories.
- id: agent-presets
  config:
    default: aeven
    includeUserRoot: false
    patches:
      # The reader cannot open this Host's folders, so files a command lists
      # in output_files are stored as attachments and shown at the call.
      - id: tool-bash
        disabled: !!js process.env.AVN_HOSTED_SANDBOX !== '1'
        config:
          shareOutputFiles: true
          # 2 GiB per account per UTC day, beside the per-call and per-conversation caps.
          shareLedgerDirectory: !!js avnHomePath('sandbox', 'share-ledger')
          shareMaxAccountBytesPerDay: 2147483648
      - id: tool-pwsh
        disabled: true
      # With the jail, the model reads files and looks at images in the
      # account folder; it writes through jailed commands, because a Host-side
      # write could follow a symlink a command swaps in. Search runs ripgrep on
      # the Host, so it stays off; commands have find and grep.
      - id: tool-fs
        disabled: !!js process.env.AVN_HOSTED_SANDBOX !== '1'
        config:
          confineToWorkspace: true
          mutations: false
      - id: tool-fs-search
        disabled: true
      - id: tool-subagent-codex
        disabled: true
      - id: tool-subagent-claude-code
        disabled: true
      - id: workflow-worker-thread
        disabled: true
      - id: tool-workflow
        disabled: true
      - id: tool-ralph
        disabled: true
      - id: tool-browser
        disabled: true
      - id: tool-device
        disabled: true
      - id: tool-cordis
        disabled: true
      - id: tool-presentation
        disabled: true
      - id: skill-filesystem
        config:
          includeDefaultRoots: false
          customSkillDirs:
            - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('./skills/', baseUrl))"

# ── starting processes without forking the Host ────────────────────────────

# A Host serving many accounts grows large, and every fork of it copies its page
# tables while its event loop serves no one (about 35 ms at 1.2 GB). The
# executor's small helper keeps idle launchers that become each command, so
# the Host never forks for one.
- id: subprocess
  disabled: !!js process.platform !== 'win32'

- insert:
    - id: subprocess-executor
      name: '@aeven/subprocess-executor'
      disabled: !!js process.platform === 'win32'
      config:
        poolSize: 8

# ── commands in a per-account jail ──────────────────────────────────────────

# AVN_HOSTED_SANDBOX=1 turns on the bash tool, and every command runs in the
# calling account's jail: fresh namespaces without network that see the
# read-only system and /opt/aeven-sandbox (Python and Node with preinstalled
# libraries; nothing can be installed), that account's folder, and a private
# /tmp, under that account's CPU, memory, and process limits. The Host must run
# in a systemd unit with Delegate=yes and DelegateSubgroup=host; the jail's
# cgroups are its unit's. packages/sandbox/sandbox-jail/README.md lists the
# host setup. The jail replaces the local sandbox, whose profiles read the
# whole disk; without the flag no tool runs a command, and the local provider
# stays only so the shell service the automations depend on can start.
- id: sandbox
  disabled: !!js process.env.AVN_HOSTED_SANDBOX === '1'

- insert:
    - id: sandbox-jail
      name: '@aeven/sandbox-jail'
      disabled: !!js process.env.AVN_HOSTED_SANDBOX !== '1'
      config:
        accountsRoot: !!js avnHomePath('sandbox', 'accounts')
        readOnlyPaths:
          - /usr
          - /opt/aeven-sandbox
          - /etc/alternatives
          - /etc/ld.so.cache
          - /etc/ld.so.conf
          - /etc/ld.so.conf.d
          - /etc/localtime
          - /etc/fonts
          - /var/cache/fontconfig
          - /etc/ssl/certs
          - /etc/mime.types
          - /etc/passwd
          - /etc/group
          - /etc/nsswitch.conf
        env:
          # The zygote's python3 shim comes first (host/install-python-zygote.sh).
          PATH: /opt/aeven-sandbox/shim:/opt/aeven-sandbox/bin:/usr/bin:/bin
          NODE_PATH: /opt/aeven-sandbox/node/node_modules
          NODE_COMPILE_CACHE: /opt/aeven-sandbox/node/compile-cache
          PLAYWRIGHT_BROWSERS_PATH: /opt/aeven-sandbox/ms-playwright
          LANG: C.UTF-8
          TMPDIR: /tmp
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp
          PYTHONDONTWRITEBYTECODE: '1'
        tmpSizeMb: 512
        seccompFilter: /opt/aeven-sandbox/seccomp.bpf
        # Commands and the zygote run as aeven-sandbox, which cannot enter this
        # Host's data directory (host/install-sandbox-user.sh prepares it).
        commandUser:
          exec: /usr/local/libexec/aeven-sandbox-exec
          group: aeven-sandbox
          accountsPath: /srv/aeven-accounts
        # One interpreter with the data stack already imported runs every
        # jailed python3 that uses it, joined to the caller's own jail.
        pythonZygote:
          python: /opt/aeven-sandbox/bin/python3
          script: /opt/aeven-sandbox/shim/python-zygote.py
          preload: [numpy, pandas, matplotlib, matplotlib.pyplot]
          socketDir: /var/lib/aeven-zygote
          limits:
            memoryMax: 2G
            pidsMax: '128'
            cpuMax: max 100000
            cpuWeight: '100'
        sessionAttachments: true
        # 5 GiB and 200,000 files per account folder, as an ext4 project quota on
        # the accounts filesystem; the helper refuses any path that is not one
        # account folder directly under that filesystem.
        quotaCommand: [sudo, -n, /usr/local/sbin/aeven-sandbox-quota, '5242880', '200000']
        quotaRecord: /var/lib/aeven-sandbox/projects
        modelNote: >-
          Commands run in an isolated Linux sandbox without network access, so nothing can be
          downloaded or installed (no pip, npm, apt, curl, or git clone). Installed: Python 3.12 with
          numpy, pandas, scipy, scikit-learn, statsmodels, matplotlib, seaborn, sympy, pyarrow, openpyxl,
          xlsxwriter, python-docx, python-pptx, pypdf, reportlab, pillow, beautifulsoup4, lxml, and
          tabulate; Node.js 22 with lodash, dayjs, exceljs, docx, pptxgenjs, pdf-lib, papaparse, mathjs,
          and marked. The working directory is this account's own folder, and files saved there stay
          between commands and conversations. Files the user uploaded can be opened by commands at the
          path shown with each upload. To give the user a chart, document, or spreadsheet, save it there
          and list it in output_files; use read_image to look at an image you made. To make an animation, motion
          graphics, or a short film, follow the motion skill: show the composition with show_motion, which
          the user plays, scrubs, and exports to MP4, and call render_motion only when the user asks you for
          the video file. Node.js also has playwright-core
          with Chromium for screenshots and PDFs of pages. Installed fonts: Google Sans Flex, Inter, Roboto
          Flex, Montserrat, Poppins, DM Sans, Space Grotesk, Outfit, Bebas Neue, Oswald, Playfair Display,
          Lora, JetBrains Mono, and Noto for every script, CJK, and colour emoji; web font links do not load.
        cgroup:
          # The unit's cgroup: the parent of the `host` group systemd starts this process in.
          root: !!js "process.env.AVN_HOSTED_SANDBOX === '1' ? '/sys/fs/cgroup' + process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:fs').readFileSync('/proc/self/cgroup', 'utf8').trim().split('::')[1] ?? '/') : ''"
          total:
            memoryMax: 32G
            pidsMax: '4096'
            cpuMax: 1200000 100000
            cpuWeight: '100'
          account:
            memoryMax: 2G
            pidsMax: '256'
            cpuMax: 200000 100000
            cpuWeight: '100'

# Commands write only inside their account's folder, and no approval can widen
# that: an escalation to full access would run on the Host itself. A session
# with no account folder resolves to a folder outside every account, which the
# jail refuses.
- id: sandbox-policy
  config:
    mode: workspace-write
    ceiling: workspace-write
    workspaceRoot: !!js "(process.getBuiltinModule('node:fs').mkdirSync(avnHomePath('sandbox', 'unowned'), { recursive: true }), avnHomePath('sandbox', 'unowned'))"

# Uploaded clips are untrusted media: ffprobe reads them inside a jail without
# network that sees only /usr and the directory the clip is written to, capped
# at 1 GiB of address space and 30 s of CPU.
- id: document-extract-video
  config:
    probeDirectory: !!js "(process.getBuiltinModule('node:fs').mkdirSync(avnHomePath('sandbox', 'probe'), { recursive: true, mode: 0o700 }), avnHomePath('sandbox', 'probe'))"
    probeRunner: !!js "process.platform === 'linux' ? ['/usr/bin/prlimit', '--as=1073741824', '--cpu=30', '--', '/usr/bin/bwrap', '--unshare-all', '--unshare-user', '--disable-userns', '--die-with-parent', '--new-session', '--clearenv', '--ro-bind', '/usr', '/usr', '--ro-bind', '/etc/alternatives', '/etc/alternatives', '--ro-bind', '/etc/ld.so.cache', '/etc/ld.so.cache', '--symlink', 'usr/lib', '/lib', '--symlink', 'usr/lib64', '/lib64', '--symlink', 'usr/bin', '/bin', '--proc', '/proc', '--dev', '/dev', '--ro-bind', avnHomePath('sandbox', 'probe'), avnHomePath('sandbox', 'probe'), '--'] : undefined"

- id: tools
  config:
    mode: native

- id: code-runtime
  disabled: true

# The Host is no reader's desktop: it opens no path in a native application,
# and produced files open from the copies the conversation stored. Every read a
# browser makes names a Session of the reader's own account: `/api/file`,
# which reads any path the Host can, stays off, and the Files sidebar reads
# through the Session-scoped `/api/workspace-file` route.
- id: session-controller
  config:
    directImageReads: false
    nativeOpen: false
    pathReads: false

# Motion films play live in the conversation, and every render runs inside the
# calling account's jail: the renderer bundles a composition from the account's
# folder into the document stored with the show_motion call, which the card
# plays, and pipes that document into the jail's render-motion for stills and
# MP4s. The routes that read any Host path stay off; the card exports through
# the conversation's own call, and the replay route plays a film shown on
# another of the account's devices from its composition rebuilt out of the log.
- insert:
    - id: motion
      name: '@aeven/motion'
    - id: motion-sandbox
      name: '@aeven/motion-sandbox'
    - id: api-motion
      name: '@aeven/api-motion'
      config:
        folderRoutes: false

- id: workflow-worker-thread
  disabled: true

- insert:
    - id: hosted-runtime
      name: '@aeven/hosted-app'
      config:
        # Cloudflare fronts the hosted page and states the visitor's country here.
        countryHeader: cf-ipcountry
        perAccount: 2
        total: 64
        queuedPerAccount: 8
        queuedTotal: 128
