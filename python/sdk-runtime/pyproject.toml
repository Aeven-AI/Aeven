[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "aeven-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled avn CLI runtime for the Aeven Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/Aeven-AI/Aeven"
Documentation = "https://github.com/Aeven-AI/Aeven/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/Aeven-AI/Aeven/issues"
Source = "https://github.com/Aeven-AI/Aeven"

[project.scripts]
avn = "aeven_runtime:main"

# Include the injected avn executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = ["src/aeven_runtime/runtime/aeven-sdk-runtime-*"]
exclude = ["src/aeven_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/aeven_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
