# Pull-request gate matrix. The local hooks in lefthook.yml stay narrow
# checkpoints; this workflow runs the lanes scripts/run-gates.ts already
# defines, and the `main` ruleset requires the four job names below.
name: CI

on:
  pull_request:
    branches:
      - main
  # A merge queue re-checks the merged result, so a queued batch runs the same
  # lanes instead of entering `main` on its source pull requests' evidence.
  merge_group:
  workflow_dispatch:

# A later push on the same ref supersedes the run it replaces. A merge-queue
# batch carries its own ref, so no pull-request push cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Report the first failing gate in a lane instead of spending the job budget
  # on the gates queued behind it.
  AVN_GATE_FAIL_FAST: '1'

jobs:
  # The unit suite itself: every package's behaviour tests, forked per file.
  # Runs beside the static lane so the pass costs its own duration, not a queue.
  test:
    name: test
    # `skip-ci` merges a change this lane cannot inform, such as workflow policy.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite loads published dependencies (`@deepseek-ai/dsh-llm` through
      # `dsh-coding-oauth-core`) that import the vendored cordis by its built
      # `lib/`, so a checkout with no build output cannot run it at all.
      - name: Build
        run: pnpm run build
      # The workspace build leaves `native/` alone, and the daemon spec launches
      # this entry rather than its source.
      - name: Build the telegram daemon entry
        run: pnpm --filter @aeven/telegram-mcp run build
      - name: Unit suite
        run: pnpm run check:ci:test
      # The config catalogue's source checks, without comparing the committed
      # artefact: a schema field missing from its declared type fails here, and
      # nothing about this step depends on which machine ran it.
      - name: Config schema validation
        run: pnpm run verify-config-schema

  # Build-free: constraints, package manifests and licenses, Cordis config, the
  # client surface (CSS baseline, UI i18n, type scale, dispatchers), and every
  # generated documentation reference against its source. Advisory: these gates
  # report, and a green run is the norm, but a stale generated artefact or a
  # host-sensitive fixture must not hold a fix or a release.
  static:
    name: static
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static gates
        run: pnpm run check:ci:static

  # The only lane that compiles the whole workspace: Host lib (including the
  # generated Typert contracts), Client tsc, then repository-wide Oxlint and
  # cross-file duplication.
  types-lint:
    name: types-lint
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint and duplication
        run: pnpm run check:ci:lint:contracts-ready

  # One build, then everything that reads its output: the shipped publish surface
  # (publint, NodeNext consumer types, built-package invariants). Two separate
  # jobs would build the workspace twice.
  build-verify:
    name: build-verify
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build once, then verify the publish surface
        run: pnpm run check:ci:build-verify
