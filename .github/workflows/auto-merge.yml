name: Auto-merge

# Merges a pull request as soon as the CI run for its head commit concludes
# successfully, and only when the repository owner opened it from a branch in this
# repository. Anyone else's pull request — a collaborator's, a fork's — waits for
# the owner to merge it. GitHub's native auto-merge is disabled on this repository,
# so the decision is made here from the run's conclusion. Drafts and anything
# labelled `do-not-merge` are left alone.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge the pull request whose CI run just succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "no pull request owns $SHA; nothing to merge"
            exit 0
          fi
          read -r draft labels author < <(gh pr view "$pr" --repo "$REPO" \
            --json isDraft,labels,author \
            --jq '"\(.isDraft) \([.labels[].name] | join(",")) \(.author.login)"')
          # The owner is the account holding admin permission; `github.repository_owner`
          # names the organization, so permission is the fact to read, not the name.
          permission=$(gh api "repos/$REPO/collaborators/$author/permission" --jq '.permission' 2>/dev/null || echo none)
          if [ "$permission" != "admin" ]; then
            echo "pull request #$pr was opened by $author ($permission), not an administrator; leaving it for a human merge"
            exit 0
          fi
          if [ "$draft" = "true" ]; then
            echo "pull request #$pr is a draft; leaving it open"
            exit 0
          fi
          case ",$labels," in
            *,do-not-merge,*) echo "pull request #$pr is labelled do-not-merge; leaving it open"; exit 0 ;;
          esac
          gh pr merge "$pr" --repo "$REPO" --merge --delete-branch
