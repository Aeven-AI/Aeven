name: Merge guard

# `main` accepts a merge only from a pull request the repository owner opened.
# The workflow is the machine-readable half of that rule: the `owner-only` check is
# required on `main`, so a pull request from anyone else stays unmergeable however
# green its CI run is. Access control already leaves one account with write
# permission; this keeps the rule true if that ever changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  owner-only:
    name: owner-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a repository administrator as the pull request author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LOGIN: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The owner is the account holding admin permission. `github.repository_owner`
          # names the organization here, so permission is the fact to read, not the name.
          permission=$(gh api "repos/$REPO/collaborators/$LOGIN/permission" --jq '.permission' 2>/dev/null || echo none)
          if [ "$permission" != "admin" ]; then
            echo "::error::Only an administrator merges into main; #$NUMBER was opened by $LOGIN ($permission)."
            exit 1
          fi
          echo "#$NUMBER was opened by $LOGIN, an administrator of $REPO."
