# Build the desktop application for every release target, upload each target's
# installers and update feeds to one draft GitHub Release as it finishes, and
# publish the release once every target has uploaded.
#
# A `v<version>` tag that matches the root package.json version starts a run
# that builds every target and publishes. A manual run names the targets it
# builds in the comma separated `targets` input — `all` builds every target, as
# a tag does — and keeps the installers as workflow artifacts; with `publish`
# set it uploads completed targets under the version tag.
# The release targets are win-x64, win-arm64, mac-arm64, mac-arm64-unsigned,
# mac-x64, mac-x64-unsigned, linux-x64, and linux-arm64.
# Each Windows and macOS target signs when all of its secrets exist, builds
# unsigned when none exist, and fails when only some exist. Linux packages
# carry no code signature, and the `unsigned` macOS variant always builds
# without one, so a DMG is available while notarization is pending:
#   Windows - Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID,
#             AZURE_CLIENT_SECRET, AZURE_TRUSTED_SIGNING_ENDPOINT,
#             AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
#             AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
#             AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
#   macOS   - Developer ID and notarization: MACOS_CERTIFICATE_P12 (base64),
#             MACOS_CERTIFICATE_PASSWORD, AVN_DESKTOP_MACOS_SIGNING_IDENTITY,
#             AVN_DESKTOP_MACOS_TEAM_ID, APPLE_API_KEY_P8 (key file contents),
#             APPLE_API_KEY_ID, APPLE_API_ISSUER
# The application id comes from the AVN_DESKTOP_APP_ID repository variable.
# The Aeven deployment the application signs in to comes from the AEVEN_API_URL,
# AEVEN_WEB_URL, AEVEN_MEDIA_URL, AEVEN_OAUTH_X_URL, AEVEN_OAUTH_APPLE_URL,
# AEVEN_OAUTH_GOOGLE_URL, and SLACK_CLIENT_ID repository variables.
name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: Comma separated release targets — win-x64, win-arm64, mac-arm64, mac-arm64-unsigned, mac-x64, mac-x64-unsigned, linux-x64, linux-arm64 — or `all` for every target
        type: string
        default: all
      publish:
        description: Publish the GitHub Release and update feeds (unset keeps the installers as workflow artifacts)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The target list is the single source for both the manual selection and the
  # tag-release run: a tag builds every entry, a manual run the named ones.
  plan:
    name: Select release targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Select release targets
        id: select
        env:
          REQUESTED_TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          targets='[
            {"id":"win-x64","target":"win-x64","runner":"windows-latest","script":"win:x64"},
            {"id":"win-arm64","target":"win-arm64","runner":"windows-11-arm","script":"win:arm64"},
            {"id":"mac-arm64","target":"mac-arm64","runner":"macos-15","script":"mac:arm64"},
            {"id":"mac-arm64-unsigned","target":"mac-arm64","variant":"unsigned","runner":"macos-15","script":"mac:arm64"},
            {"id":"mac-x64","target":"mac-x64","runner":"macos-15-intel","script":"mac:x64"},
            {"id":"mac-x64-unsigned","target":"mac-x64","variant":"unsigned","runner":"macos-15-intel","script":"mac:x64"},
            {"id":"linux-x64","target":"linux-x64","runner":"ubuntu-24.04","script":"linux:x64"},
            {"id":"linux-arm64","target":"linux-arm64","runner":"ubuntu-24.04-arm","script":"linux:arm64"}
          ]'
          known_ids="$(printf '%s' "$targets" | jq -r '[.[].id] | join(" ")')"
          # `targets` is a comma separated list from a free-text input, so spacing and empty entries are the operator's, not errors.
          requested="$(printf '%s' "$REQUESTED_TARGETS" | tr ',' ' ' | tr -s '[:space:]' ' ' | sed -e 's/^ //' -e 's/ $//')"
          if [ "$requested" = all ]; then wanted="$known_ids"; else wanted="$requested"; fi
          unknown=""
          for id in $wanted; do
            case " $known_ids " in *" $id "*) ;; *) unknown="$unknown $id" ;; esac
          done
          if [ -n "$unknown" ]; then
            echo "::error::not a release target:$unknown; name a comma separated list of $known_ids, or all"
            exit 1
          fi
          # The matrix keeps the target list's order and drops repeated ids, which selects each named target once.
          matrix="$(printf '%s' "$targets" | jq -c --arg wanted "$wanted" \
            '($wanted | split(" ")) as $ids | {include: [.[] | select(.id as $id | $ids | index($id)) | . + {variant: (.variant // "")}]}')"
          selected="$(printf '%s' "$matrix" | jq '.include | length')"
          if [ "$selected" -eq 0 ]; then
            echo "::error::no release target named; name a comma separated list of $known_ids, or all"
            exit 1
          fi
          # Publishing runs select every target; each completed target uploads independently.
          if [ "${{ inputs.publish }}" = true ] && [ "$selected" -ne "$(printf '%s' "$targets" | jq 'length')" ]; then
            echo "::error::publishing needs every release target, but this run builds $(printf '%s' "$matrix" | jq -r '[.include[].id] | join(", ")')"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "selected: $(printf '%s' "$matrix" | jq -r '[.include[].id] | join(", ")')"

  build:
    name: Release ${{ matrix.id }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/release-desktop-target.yml
    with:
      target: ${{ matrix.target }}
      variant: ${{ matrix.variant }}
      runner: ${{ matrix.runner }}
      script: ${{ matrix.script }}
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
    secrets: inherit

  # electron-updater reads only the newest public release and does not fall back
  # to an older one, so a public release without a platform's feed hides every
  # earlier update from that platform. The release stays a draft until every
  # target has uploaded; rerunning a failed target publishes it.
  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
