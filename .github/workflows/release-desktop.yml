# Build the desktop application for every release target and publish the
# installers and the update feeds as one GitHub Release.
#
# A `v<version>` tag that matches the root package.json version starts a run
# that builds every target and publishes. A manual run names the targets it
# builds in the comma separated `targets` input — `all` builds every target, as
# a tag does — and keeps the installers as workflow artifacts; with `publish`
# set it publishes under the version tag, which needs every target.
# The release targets are win-x64, win-arm64, mac-arm64, mac-arm64-unsigned,
# mac-x64, mac-x64-unsigned, linux-x64, and linux-arm64.
# Each Windows and macOS target signs when all of its secrets exist, builds
# unsigned when none exist, and fails when only some exist. Linux packages
# carry no code signature, and the `unsigned` macOS variant always builds
# without one, so a DMG is available while notarization is pending:
#   Windows - Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID,
#             AZURE_CLIENT_SECRET, AZURE_TRUSTED_SIGNING_ENDPOINT,
#             AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
#             AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
#             AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
#   macOS   - Developer ID and notarization: MACOS_CERTIFICATE_P12 (base64),
#             MACOS_CERTIFICATE_PASSWORD, AVN_DESKTOP_MACOS_SIGNING_IDENTITY,
#             AVN_DESKTOP_MACOS_TEAM_ID, APPLE_API_KEY_P8 (key file contents),
#             APPLE_API_KEY_ID, APPLE_API_ISSUER
# The application id comes from the AVN_DESKTOP_APP_ID repository variable.
# The Aeven deployment the application signs in to comes from the AEVEN_API_URL,
# AEVEN_WEB_URL, AEVEN_MEDIA_URL, AEVEN_OAUTH_X_URL, AEVEN_OAUTH_APPLE_URL,
# AEVEN_OAUTH_GOOGLE_URL, and SLACK_CLIENT_ID repository variables.
name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: Comma separated release targets — win-x64, win-arm64, mac-arm64, mac-arm64-unsigned, mac-x64, mac-x64-unsigned, linux-x64, linux-arm64 — or `all` for every target
        type: string
        default: all
      publish:
        description: Publish the GitHub Release and update feeds (unset keeps the installers as workflow artifacts)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The target list is the single source for both the manual selection and the
  # tag-release run: a tag builds every entry, a manual run the named ones.
  plan:
    name: Select release targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Select release targets
        id: select
        env:
          REQUESTED_TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          targets='[
            {"id":"win-x64","target":"win-x64","runner":"windows-latest","script":"win:x64"},
            {"id":"win-arm64","target":"win-arm64","runner":"windows-11-arm","script":"win:arm64"},
            {"id":"mac-arm64","target":"mac-arm64","runner":"macos-15","script":"mac:arm64"},
            {"id":"mac-arm64-unsigned","target":"mac-arm64","variant":"unsigned","runner":"macos-15","script":"mac:arm64"},
            {"id":"mac-x64","target":"mac-x64","runner":"macos-15-intel","script":"mac:x64"},
            {"id":"mac-x64-unsigned","target":"mac-x64","variant":"unsigned","runner":"macos-15-intel","script":"mac:x64"},
            {"id":"linux-x64","target":"linux-x64","runner":"ubuntu-24.04","script":"linux:x64"},
            {"id":"linux-arm64","target":"linux-arm64","runner":"ubuntu-24.04-arm","script":"linux:arm64"}
          ]'
          known_ids="$(printf '%s' "$targets" | jq -r '[.[].id] | join(" ")')"
          # `targets` is a comma separated list from a free-text input, so spacing and empty entries are the operator's, not errors.
          requested="$(printf '%s' "$REQUESTED_TARGETS" | tr ',' ' ' | tr -s '[:space:]' ' ' | sed -e 's/^ //' -e 's/ $//')"
          if [ "$requested" = all ]; then wanted="$known_ids"; else wanted="$requested"; fi
          unknown=""
          for id in $wanted; do
            case " $known_ids " in *" $id "*) ;; *) unknown="$unknown $id" ;; esac
          done
          if [ -n "$unknown" ]; then
            echo "::error::not a release target:$unknown; name a comma separated list of $known_ids, or all"
            exit 1
          fi
          # The matrix keeps the target list's order and drops repeated ids, which selects each named target once.
          matrix="$(printf '%s' "$targets" | jq -c --arg wanted "$wanted" \
            '($wanted | split(" ")) as $ids | {include: [.[] | select(.id as $id | $ids | index($id)) | . + {variant: (.variant // "")}]}')"
          selected="$(printf '%s' "$matrix" | jq '.include | length')"
          if [ "$selected" -eq 0 ]; then
            echo "::error::no release target named; name a comma separated list of $known_ids, or all"
            exit 1
          fi
          # A release carries every target's installers and update feeds, so a partial build cannot publish.
          if [ "${{ inputs.publish }}" = true ] && [ "$selected" -ne "$(printf '%s' "$targets" | jq 'length')" ]; then
            echo "::error::publishing needs every release target, but this run builds $(printf '%s' "$matrix" | jq -r '[.include[].id] | join(", ")')"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "selected: $(printf '%s' "$matrix" | jq -r '[.include[].id] | join(", ")')"

  build:
    name: Build ${{ matrix.target }}${{ matrix.variant && format(' ({0})', matrix.variant) || '' }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    # The macOS targets wait on Apple's notarization queue rather than on the
    # runner, so they take GitHub's six-hour job ceiling; the other targets fit
    # in a window that a stalled package step cannot hold all day.
    timeout-minutes: ${{ startsWith(matrix.target, 'mac-') && 360 || 150 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      AVN_DESKTOP_APP_ID: ${{ vars.AVN_DESKTOP_APP_ID || 'com.aeven.desktop' }}
      AEVEN_API_URL: ${{ vars.AEVEN_API_URL || 'https://aeven.io/api' }}
      AEVEN_WEB_URL: ${{ vars.AEVEN_WEB_URL }}
      AEVEN_MEDIA_URL: ${{ vars.AEVEN_MEDIA_URL }}
      AEVEN_OAUTH_X_URL: ${{ vars.AEVEN_OAUTH_X_URL }}
      AEVEN_OAUTH_APPLE_URL: ${{ vars.AEVEN_OAUTH_APPLE_URL }}
      AEVEN_OAUTH_GOOGLE_URL: ${{ vars.AEVEN_OAUTH_GOOGLE_URL }}
      SLACK_CLIENT_ID: ${{ vars.SLACK_CLIENT_ID }}
      # electron-builder's bundled fpm is x64-only, so deb packaging uses the
      # system fpm installed below, as linux-builder.Dockerfile does.
      USE_SYSTEM_FPM: ${{ startsWith(matrix.target, 'linux-') && 'true' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Intel macOS image ships pnpm 11.25.0. Downgrading to the version this project pins makes pnpm verify
      # its own engine identity against the project lockfile, which records no @pnpm/exe platform binary, and it
      # refuses to run. Install the pinned release through npm on that target instead of switching versions.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ !startsWith(matrix.target, 'mac-x64') }}

      - name: Install the pinned pnpm for the Intel macOS target
        if: ${{ startsWith(matrix.target, 'mac-x64') }}
        run: |
          npm install --global pnpm@11.7.0
          pnpm --version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/whatsapp-mcp/source/go.mod
          cache: false

      - name: Check the tag matches the release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # The tools linux-builder.Dockerfile adds to its Node image: fpm and
      # fakeroot package the deb, CMake builds the native speech worker.
      - name: Install Linux packaging tools
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ruby ruby-dev fakeroot cmake
          sudo gem install --no-document fpm

      # ffmpeg builds from its pinned release source on every target, with libopus compiled statically from its
      # own pinned source. configure needs a POSIX shell, pkg-config, a zlib development package, and nasm for
      # the x86_64 assembly kernels. Each Windows target installs only its own toolchain: fetching both doubled
      # the download, and one slow mirror failed the whole transaction. pacman is retried for the same reason.
      - name: Install ffmpeg build tools (macOS)
        if: startsWith(matrix.target, 'mac-')
        run: brew install pkg-config nasm

      - name: Install ffmpeg build tools (Linux)
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get install --yes --no-install-recommends zlib1g-dev pkg-config nasm libva-dev

      # The same MSYS2 setup the ffmpeg-only workflow uses: the action installs and updates the environment, and
      # its package set supplies the compiler, binutils, static libopus, pkgconf, nasm, make, and diffutils.
      - name: Set up MSYS2 (Windows x64)
        if: matrix.target == 'win-x64'
        id: msys2-x64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: CLANG64
          release: false
          update: true
          install: >-
            make nasm diffutils pkgconf
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-binutils
            mingw-w64-clang-x86_64-opus mingw-w64-clang-x86_64-zlib

      - name: Set up MSYS2 (Windows arm64)
        if: matrix.target == 'win-arm64'
        id: msys2-arm64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: CLANGARM64
          release: false
          update: true
          install: >-
            make nasm diffutils pkgconf
            mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-binutils
            mingw-w64-clang-aarch64-opus mingw-w64-clang-aarch64-zlib

      - run: pnpm install --frozen-lockfile

      - name: Choose signed or unsigned
        id: signing
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          AVN_DESKTOP_MACOS_SIGNING_IDENTITY: ${{ secrets.AVN_DESKTOP_MACOS_SIGNING_IDENTITY }}
          AVN_DESKTOP_MACOS_TEAM_ID: ${{ secrets.AVN_DESKTOP_MACOS_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "${{ matrix.variant }}" = unsigned ]; then
            echo "unsigned=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.target }}: unsigned variant"
            exit 0
          fi
          case "${{ matrix.target }}" in
            linux-*)
              echo "unsigned=false" >> "$GITHUB_OUTPUT"
              echo "${{ matrix.target }}: Linux packages carry no code signature"
              exit 0
              ;;
            win-*) names="AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT_NAME AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME AZURE_TRUSTED_SIGNING_PUBLISHER_NAME" ;;
            mac-*) names="MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD AVN_DESKTOP_MACOS_SIGNING_IDENTITY AVN_DESKTOP_MACOS_TEAM_ID APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER" ;;
          esac
          present=""
          missing=""
          for name in $names; do
            if [ -n "${!name}" ]; then present="$present $name"; else missing="$missing $name"; fi
          done
          if [ -n "$present" ] && [ -n "$missing" ]; then
            echo "::error::${{ matrix.target }}: signing is partly configured; missing:${missing}"
            exit 1
          fi
          if [ -z "$missing" ]; then unsigned=false; else unsigned=true; fi
          echo "unsigned=${unsigned}" >> "$GITHUB_OUTPUT"
          if [ "$unsigned" = false ]; then echo "${{ matrix.target }}: signing enabled"; else echo "${{ matrix.target }}: no signing secrets, building unsigned"; fi

      # Seed preparation signs every embedded Mach-O with `codesign --sign`
      # before electron-builder runs, so the Developer ID identity must already
      # be in a keychain on the search list.
      - name: Import the macOS signing identity
        if: startsWith(matrix.target, 'mac-') && steps.signing.outputs.unsigned == 'false'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      # The pinned ffmpeg and libopus archives, keyed by their pins, so a release does not depend on every
      # upstream host answering on every runner.
      - name: Cache the pinned ffmpeg sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/ffmpeg/.cache/*.tar.gz
          key: ffmpeg-sources-${{ hashFiles('native/ffmpeg/source.json') }}

      # The Node.js and Cua Driver archives, keyed by the pins in prepare-runtime.ts for the same reason. The two
      # macOS variants of one architecture share the key, so a signed build can reuse the archives the unsigned
      # build beside it already fetched, and prepare-runtime.ts checks every cached archive against its checksum
      # file before use.
      - name: Cache the pinned runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/.desktop-build/downloads
          key: desktop-runtime-${{ matrix.target }}-${{ hashFiles('apps/desktop/scripts/prepare-runtime.ts') }}
          restore-keys: desktop-runtime-${{ matrix.target }}-

      - name: Select the MSYS2 environment (Windows)
        if: startsWith(matrix.target, 'win-')
        run: echo "MSYSTEM=${{ matrix.target == 'win-arm64' && 'CLANGARM64' || 'CLANG64' }}" >> "$GITHUB_ENV"

      - name: Package
        env:
          # The setup action may place MSYS2 outside C:\msys64; the native ffmpeg build reads it from here.
          MSYS2_ROOT: ${{ (matrix.target == 'win-arm64' && steps.msys2-arm64.outputs.msys2-location || steps.msys2-x64.outputs.msys2-location) || 'C:\\msys64' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          AVN_DESKTOP_MACOS_SIGNING_IDENTITY: ${{ secrets.AVN_DESKTOP_MACOS_SIGNING_IDENTITY }}
          AVN_DESKTOP_MACOS_TEAM_ID: ${{ secrets.AVN_DESKTOP_MACOS_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "${{ steps.signing.outputs.unsigned }}" = true ]; then
            pnpm run package:desktop:${{ matrix.script }}:unsigned
          else
            pnpm run package:desktop:${{ matrix.script }}
          fi

      # Each target writes its own feed under the channel's name (latest.yml,
      # alpha.yml, alpha-mac.yml, alpha-linux-arm64.yml, ...). The target goes
      # into the name so the release job can merge the two Windows feeds into
      # one. The unsigned macOS variant contributes its DMG only: its feed would
      # replace the signed build's.
      - name: Collect release assets
        run: |
          artifacts="apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts"
          mkdir -p release-assets
          shopt -s nullglob
          if [ "${{ matrix.variant }}" = unsigned ]; then
            cp "$artifacts"/*.dmg release-assets/
            ls -la release-assets
            exit 0
          fi
          for file in "$artifacts"/*.exe "$artifacts"/*.dmg "$artifacts"/*.zip "$artifacts"/*.AppImage "$artifacts"/*.deb "$artifacts"/*.blockmap; do
            cp "$file" release-assets/
          done
          for feed in "$artifacts"/*.yml; do
            name="$(basename "$feed" .yml)"
            case "$name" in builder-debug|builder-effective-config) continue ;; esac
            cp "$feed" "release-assets/${name}--${{ matrix.target }}.yml"
          done
          ls -la release-assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @aeven/desktop...

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      # electron-builder names one arch-less feed per platform, so a platform
      # built for two architectures must merge them: Windows x64+arm64 and macOS
      # x64+arm64 each become one file listing both installers, and
      # electron-updater picks the one whose name carries the running
      # architecture. Linux keeps one feed per target, which only drops its
      # suffix.
      - name: Assemble update feeds
        run: |
          shopt -s nullglob
          merge_architecture_pair() {
            local primary_suffix="$1" secondary_suffix="$2" feed name secondary
            for feed in release-assets/*--"$primary_suffix".yml; do
              name="$(basename "$feed" --"$primary_suffix".yml)"
              secondary="release-assets/${name}--${secondary_suffix}.yml"
              if [ -f "$secondary" ]; then
                pnpm --dir apps/desktop exec tsx scripts/merge-update-manifests.ts "$PWD/$feed" "$PWD/$secondary" "$PWD/release-assets/${name}.yml"
                rm "$feed" "$secondary"
              else
                mv "$feed" "release-assets/${name}.yml"
              fi
            done
          }
          merge_architecture_pair win-x64 win-arm64
          merge_architecture_pair mac-x64 mac-arm64
          for feed in release-assets/*--*.yml; do
            name="$(basename "$feed" .yml)"
            mv "$feed" "release-assets/${name%%--*}.yml"
          done
          ls -la release-assets

      - name: Resolve the release
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      # The release stays a draft until every file is uploaded: a published
      # release exposes each update feed as soon as it lands, and
      # electron-updater then requests installers that are still uploading.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Aeven ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false
